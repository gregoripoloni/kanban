<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Kanban</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <header class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <h1 class="navbar-brand mb-0 h1">Painel Kanban</h1>
      <button type="button" class="btn btn-primary" id="btn-new-task">+ Nova tarefa</button>
    </div>
  </header>

  <main class="container-fluid py-3">
    <div id="status" class="mb-3" role="status" aria-live="polite"></div>

    <section id="board" class="row g-3" aria-label="Quadro de tarefas">
    </section>
  </main>

  <div class="modal fade" id="task-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="task-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modal-title">Nova tarefa</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="task-id">
          <div class="mb-3">
            <label for="task-title" class="form-label">Título</label>
            <input type="text" class="form-control" id="task-title" required minlength="3" maxlength="80">
            <div class="invalid-feedback">Informe um título com pelo menos 3 caracteres.</div>
          </div>
          <div class="mb-3">
            <label for="task-description" class="form-label">Descrição</label>
            <textarea class="form-control" id="task-description" rows="3" maxlength="300"></textarea>
          </div>
          <div class="mb-3">
            <label for="task-status" class="form-label">Coluna</label>
            <select class="form-select" id="task-status" required></select>
          </div>
          <div id="form-error" class="alert alert-danger d-none" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
